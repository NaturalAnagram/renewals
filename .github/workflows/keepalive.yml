# Pings Supabase every 3 days so the free-tier project isn't paused for inactivity (it pauses
# after 7 days). Calls public.keepalive() from supabase/keepalive.sql with the same publishable
# key the app uses. Run it by hand from the Actions tab to check it works.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl --fail-with-body -sS -X POST \
            "https://mwalbyzlcfbonuqgfule.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: sb_publishable__3lh7CGRK6ysdCLcVw7W-A_XFXcuBN6" \
            -H "Content-Type: application/json" -d '{}'
